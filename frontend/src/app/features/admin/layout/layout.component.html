<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">Admin</div>

    <nav class="admin-sidebar__nav">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="admin-sidebar__link--active" class="admin-sidebar__link">
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="admin-sidebar__footer">
      @if (currentUser(); as user) {
        <p class="admin-sidebar__user">{{ user.name }}</p>
      }
      <button class="admin-sidebar__logout" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
