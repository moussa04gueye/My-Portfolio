<h1>Réglages du site</h1>

@if (isSaved()) {
  <p class="settings-saved">Réglages enregistrés.</p>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="admin-form">
  <div class="form-group">
    <label>Titre du site</label>
    <input type="text" formControlName="site_title" />
  </div>

  <div class="form-group">
    <label>Email de contact public</label>
    <input type="email" formControlName="contact_email" />
  </div>

  <div class="form-group">
    <label>Lien LinkedIn</label>
    <input type="url" formControlName="linkedin_url" />
  </div>

  <div class="form-group">
    <label>Lien GitHub</label>
    <input type="url" formControlName="github_url" />
  </div>

  <button type="submit" class="btn btn--primary">Enregistrer</button>
</form>
