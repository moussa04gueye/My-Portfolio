<div class="page-header">
  <h1>Formations</h1>
  <button class="btn btn--primary" (click)="newForm()">+ Nouvelle formation</button>
</div>

@if (showForm()) {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="admin-form">
    <div class="form-row">
      <div class="form-group">
        <label>École / Université</label>
        <input type="text" formControlName="school" />
      </div>
      <div class="form-group">
        <label>Diplôme</label>
        <input type="text" formControlName="degree" />
      </div>
    </div>

    <div class="form-group">
      <label>Filière (optionnel)</label>
      <input type="text" formControlName="field" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Date de début</label>
        <input type="date" formControlName="start_date" />
      </div>
      <div class="form-group">
        <label>Date de fin (vide = en cours)</label>
        <input type="date" formControlName="end_date" />
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea rows="5" formControlName="description"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn--primary">{{ editingId() ? 'Mettre à jour' : 'Créer' }}</button>
      <button type="button" class="btn btn--outline" (click)="cancel()">Annuler</button>
    </div>
  </form>
}

<table class="admin-table">
  <thead>
    <tr>
      <th>Diplôme</th>
      <th>École</th>
      <th>Période</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (ed of educations(); track ed.id) {
      <tr>
        <td>{{ ed.degree }}</td>
        <td>{{ ed.school }}</td>
        <td>{{ ed.start_date }} — {{ ed.end_date || 'Présent' }}</td>
        <td class="admin-table__actions">
          <button class="btn btn--outline btn--sm" (click)="edit(ed)">Éditer</button>
          <button class="btn-delete" (click)="remove(ed)">Supprimer</button>
        </td>
      </tr>
    }
  </tbody>
</table>
