<section class="section">
  <div class="container">
    <app-section-title
      eyebrow="Portfolio"
      title="Tous les projets"
      subtitle="Une sélection de mes réalisations, du plus récent au plus ancien."
    />

    @if (isLoading()) {
      <app-loader />
    } @else if (projects().length === 0) {
      <p>Aucun projet publié pour le moment.</p>
    } @else {
      <div class="project-grid stagger">
        @for (project of projects(); track project.id) {
          <a [routerLink]="['/projets', project.slug]" class="card project-card">
            @if (project.cover_image) {
              <div class="project-card__image-wrap">
                <img [src]="project.cover_image" [alt]="project.title" class="project-card__image" />
              </div>
            }
            <div class="project-card__body">
              <h3>{{ project.title }}</h3>
              <p>{{ project.summary }}</p>
              <div class="project-card__tags">
                @for (skill of project.skills.slice(0, 4); track skill.id) {
                  <app-badge [label]="skill.name" />
                }
              </div>
            </div>
          </a>
        }
      </div>
    }
  </div>
</section>
