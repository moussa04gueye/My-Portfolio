<header class="navbar">
  <div class="container navbar__inner">
    <div class="navbar__brand-group">
      <a routerLink="/" class="navbar__brand" (click)="closeMenu()">root@Moussa Gueye</a>

      <button
        type="button"
        class="navbar__theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Activer le thème clair' : 'Revenir au thème sombre'"
      >
        {{ theme() === 'dark' ? '🛡️' : '' }}
      </button>
    </div>

    <nav class="navbar__links" [class.navbar__links--open]="isMenuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="navbar__link"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button class="navbar__toggle" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
