<div class="section-title" [class.section-title--center]="align === 'center'">
  @if (eyebrow) {
    <span class="section-title__eyebrow">{{ eyebrow }}</span>
  }
  <h2 class="section-title__title">{{ title }}</h2>
  @if (subtitle) {
    <p class="section-title__subtitle">{{ subtitle }}</p>
  }
</div>
